<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوا منخفّف الوجع | Lebanon</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* تعديل الألوان للفوشيا الغامق */
            --bg-dark: #2d0a1f; 
            --card-bg: #430e2e; 
            --accent-green: #2ecc71;
            --accent-red: #ff2d75; 
            --accent-orange: #f39c12;
            --text-main: #ffffff;
            --text-dim: #f19fcb;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: var(--text-main); transition: 0.3s; overflow-x: hidden; }
        [dir="rtl"] body { text-align: right; }
        [dir="ltr"] body { text-align: left; }

        header {
            background-color: var(--card-bg); padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #5a123d; position: sticky; top: 0; z-index: 2001;
        }

        .header-controls { display: flex; gap: 10px; align-items: center; }
        .control-btn { 
            background: #5a123d; border: 1px solid #7a1852; color: white; 
            padding: 8px; border-radius: 8px; cursor: pointer; 
            font-size: 0.9rem; transition: 0.3s; display: flex; align-items: center; gap: 5px;
            position: relative;
        }
        .control-btn.inactive { color: var(--text-dim); opacity: 0.6; }
        
        #notif-badge {
            position: absolute; top: -5px; right: -5px; background: var(--accent-red);
            width: 10px; height: 10px; border-radius: 50%; display: none; border: 2px solid var(--card-bg);
        }

        #notif-panel {
            position: fixed; top: -100%; left: 0; width: 100%; max-height: 70vh;
            background: var(--card-bg); z-index: 2000; transition: 0.5s ease-in-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-bottom: 2px solid var(--accent-red);
            overflow-y: auto; padding: 60px 20px 20px 20px;
        }
        #notif-panel.open { top: 0; }
        .notif-item {
            padding: 12px; border-bottom: 1px solid #5a123d; font-size: 0.85rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-panel { text-align: center; padding: 10px; color: var(--accent-red); cursor: pointer; font-weight: bold; }

        nav { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px; }
        nav a { color: var(--text-dim); text-decoration: none; font-size: 0.75rem; padding: 8px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        nav a.active { color: var(--text-main); background: #5a123d; border: 1px solid var(--accent-red); }

        .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .form-container, .history-container {
            background: var(--card-bg); padding: 20px; border-radius: 12px;
            max-width: 500px; margin: 0 auto; border: 1px solid #5a123d;
        }

        input, select, textarea {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #1d0614; border: 1px solid #5a123d;
            color: white; border-radius: 8px; box-sizing: border-box;
        }

        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-gps { background: #5a123d; color: white; margin-bottom: 5px; font-size: 0.8rem; }

        #map-container { height: 60vh; width: 100%; border-radius: 15px; margin-top: 10px; border: 1px solid #5a123d; }
        
        .map-legend {
            background: var(--card-bg); padding: 10px; border-radius: 8px; margin-top: 10px;
            display: flex; gap: 15px; justify-content: center; font-size: 0.8rem; border: 1px solid #5a123d;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }

        .history-item {
            background: #1d0614; border-right: 4px solid var(--accent-orange);
            padding: 15px; margin-bottom: 15px; border-radius: 8px; font-size: 0.9rem; position: relative;
        }
        [dir="ltr"] .history-item { border-right: none; border-left: 4px solid var(--accent-orange); }
        .history-item.critical { border-color: var(--accent-red); }
        .history-item.donation { border-color: var(--accent-green); }
        
        .whatsapp-btn {
            background: #27ae60; color: white; text-decoration: none; padding: 8px 15px;
            border-radius: 6px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px;
        }

        #filter-buttons button { white-space: nowrap; width: auto; padding: 8px 15px; font-size: 0.7rem; background: #5a123d; color: white; }
        #filter-buttons button.active-filter { background: var(--accent-red); }

        #notif-toast {
            position: fixed; bottom: 20px; left: 20px; background: var(--accent-red);
            color: white; padding: 12px 20px; border-radius: 50px; display: none;
            z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div id="notif-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <strong data-ar="آخر النشاطات" data-en="Recent Activities">آخر النشاطات</strong>
        <span class="close-panel" onclick="toggleNotifPanel()" data-ar="إغلاق ✕" data-en="Close ✕">إغلاق ✕</span>
    </div>
    <div id="panel-content">
        <p style="text-align:center; opacity:0.5;" data-ar="لا يوجد تنبيهات بعد" data-en="No notifications yet">لا يوجد تنبيهات بعد</p>
    </div>
</div>

<header>
    <div id="appTitle" style="font-weight: bold; color: var(--accent-red); font-size: 1.1rem;" data-ar="سوا منخفّف الوجع 🇱🇧" data-en="Together We Heal 🇱🇧">سوا منخفّف الوجع 🇱🇧</div>
    <div class="header-controls">
        <button class="control-btn" onclick="toggleLang()" id="langBtn">EN</button>
        <button class="control-btn" onclick="toggleMute()" id="muteBtn"><i class="fas fa-volume-up"></i></button>
        <button class="control-btn" onclick="toggleNotifPanel()" id="notifBtn">
            <i class="fas fa-bell"></i>
            <span id="notif-badge"></span>
        </button>
    </div>
</header>

<nav id="navbar">
    <a onclick="showPage('map-page')" id="nav-map" class="active" data-ar="الخريطة" data-en="Map">الخريطة</a>
    <a onclick="showPage('request-page')" id="nav-request" data-ar="طلب مساعدة" data-en="Request">طلب مساعدة</a>
    <a onclick="showPage('history-page')" id="nav-history" data-ar="سجل الطلبات" data-en="History">سجل الطلبات</a>
    <a onclick="showPage('donate-page')" id="nav-donate" data-ar="تبرع" data-en="Donate">تبرع</a>
</nav>

<div id="notif-toast"></div>

<div id="map-page" class="page active">
    <h3 data-ar="خريطة الاحتياجات المباشرة" data-en="Live Needs Map">خريطة الاحتياجات المباشرة</h3>
    <div id="map-container"></div>
    <div class="map-legend">
        <div class="legend-item"><span class="dot" style="background: var(--accent-red);"></span> <span data-ar="خطير جداً" data-en="Critical">خطير جداً</span></div>
        <div class="legend-item"><span class="dot" style="background: var(--accent-orange);"></span> <span data-ar="مستعجل" data-en="Urgent">مستعجل</span></div>
        <div class="legend-item"><span class="dot" style="background: var(--accent-green);"></span> <span data-ar="تبرع" data-en="Donation">تبرع</span></div>
    </div>
</div>

<div id="request-page" class="page">
    <div class="form-container">
        <h2 data-ar="تسجيل طلب احتياج" data-en="Register Need Request">تسجيل طلب احتياج</h2>
        <input type="text" id="userName" placeholder="الاسم أو اسم المركز" data-ar-ph="الاسم أو اسم المركز" data-en-ph="Name or Center Name">
        <input type="tel" id="userPhone" placeholder="رقم التواصل (واتساب)" data-ar-ph="رقم التواصل (واتساب)" data-en-ph="Contact Number (WhatsApp)">
        
        <select id="userNeedType">
            <option value="مواد غذائية" data-ar="🍎 مواد غذائية" data-en="🍎 Food Supplies">🍎 مواد غذائية</option>
            <option value="أدوية" data-ar="💊 أدوية" data-en="💊 Medicine">💊 أدوية</option>
            <option value="حليب وأطفال" data-ar="🍼 حليب وحفاضات أطفال" data-en="🍼 Baby Milk & Diapers">🍼 حليب وحفاضات أطفال</option>
            <option value="مأوى" data-ar="🏠 مأوى / سكن" data-en="🏠 Shelter / Housing">مأوى / سكن</option>
        </select>

        <select id="userUrgency">
            <option value="Urgent" data-ar="🕒 مستعجل (أورنج)" data-en="🕒 Urgent (Orange)">🕒 مستعجل (أورنج)</option>
            <option value="Critical" data-ar="🚨 طارئ جداً (أحمر)" data-en="🚨 Critical (Red)">🚨 طارئ جداً (أحمر)</option>
        </select>

        <textarea id="userText" placeholder="ما هي احتياجاتك بالتفصيل؟" rows="3" data-ar-ph="ما هي احتياجاتك بالتفصيل؟" data-en-ph="Details of your needs"></textarea>
        
        <label style="font-size: 0.8rem; color: var(--text-dim);" data-ar="تحديد الموقع:" data-en="Set Location:">تحديد الموقع:</label>
        <select id="userDistrict">
            <option value="all" data-ar="اختر القضاء لتحديد المركز..." data-en="Select District...">اختر القضاء لتحديد المركز...</option>
        </select>
        <button class="btn-gps" onclick="getLocationByGPS()" data-ar="📍 أو حدد عبر GPS" data-en="📍 Or use GPS">📍 أو حدد عبر GPS</button>

        <button class="btn-red" onclick="addRequestToFirebase()" data-ar="إرسال الطلب" data-en="Submit Request">إرسال الطلب</button>
    </div>
</div>

<div id="history-page" class="page">
    <div class="history-container">
        <h2 data-ar="أحدث الطلبات والعروض" data-en="Recent Requests & Offers">أحدث الطلبات والعروض</h2>
        <div id="filter-buttons">
            <button onclick="applyFilter('الكل')" class="active-filter" data-ar="الكل" data-en="All">الكل</button>
            <button onclick="applyFilter('أدوية')" data-ar="💊 أدوية" data-en="💊 Meds">💊 أدوية</button>
            <button onclick="applyFilter('مواد غذائية')" data-ar="🍎 غذاء" data-en="🍎 Food">🍎 غذاء</button>
            <button onclick="applyFilter('مأوى')" data-ar="🏠 مأوى" data-en="🏠 Shelter">🏠 مأوى</button>
            <button onclick="applyFilter('حليب وأطفال')" data-ar="🍼 أطفال" data-en="🍼 Kids">🍼 أطفال</button>
        </div>
        <div id="history-list">جاري تحميل البيانات...</div>
    </div>
</div>

<div id="donate-page" class="page">
    <div class="form-container">
        <h2 data-ar="تبرعك اليوم ممكن يكون أمل لحدا بكرا" data-en="Your donation today could be someone's hope tomorrow">تبرعك اليوم ممكن يكون أمل لحدا بكرا</h2>
        <input type="text" id="donorName" placeholder="اسم الجمعية أو المتبرع" data-ar-ph="اسم الجمعية أو المتبرع" data-en-ph="NGO or Donor Name">
        <input type="tel" id="donorPhone" placeholder="رقم التواصل" data-ar-ph="رقم التواصل" data-en-ph="Contact Number">
        
        <select id="donorType">
            <option value="تبرع بمواد غذائية" data-ar="🍎 مواد غذائية" data-en="🍎 Food Supplies">🍎 مواد غذائية</option>
            <option value="تبرع بأدوية" data-ar="💊 أدوية" data-en="💊 Medicine">💊 أدوية</option>
            <option value="تبرع بحليب وأطفال" data-ar="🍼 حليب وحفاضات" data-en="🍼 Baby Supplies">🍼 حليب وحفاضات</option>
            <option value="تبرع بمسكن" data-ar="🏠 تأمين مأوى" data-en="🏠 Provide Shelter">🏠 تأمين مأوى</option>
        </select>

        <textarea id="donorOffer" placeholder="تفاصيل المساعدة المتوفرة..." rows="3" data-ar-ph="تفاصيل المساعدة المتوفرة..." data-en-ph="Details of available aid"></textarea>
        
        <button class="btn-green" onclick="addDonationToFirebase()" data-ar="نشر عرض التبرع" data-en="Publish Donation Offer">نشر عرض التبرع</button>
        
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <div style="background: #0b0d0f; padding: 15px; border-radius: 10px; border-top: 4px solid #f1c40f;">
            <strong>OMT / Whish:</strong><br>
            <span style="font-size: 1.2rem; color: #f1c40f;">70028286</span>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let isMuted = false;
    let currentLang = 'ar';

    function toggleNotifPanel() {
        const panel = document.getElementById('notif-panel');
        panel.classList.toggle('open');
        if(panel.classList.contains('open')) document.getElementById('notif-badge').style.display = 'none';
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('muteBtn').innerHTML = isMuted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        document.getElementById('muteBtn').classList.toggle('inactive', isMuted);
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const html = document.getElementById('mainHtml');
        html.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        html.lang = currentLang;
        document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
        document.querySelectorAll('[data-ar]').forEach(el => {
            el.innerText = el.getAttribute(`data-${currentLang}`);
        });
        document.querySelectorAll('[data-ar-ph]').forEach(el => {
            el.placeholder = el.getAttribute(`data-${currentLang}-ph`);
        });
    }

    const firebaseConfig = {
        apiKey: "AIzaSyCXF_pquA51xXLtKQOcD3k6wTA0muXQFbI",
        authDomain: "aidmaplebanon-b7bf9.firebaseapp.com",
        projectId: "aidmaplebanon-b7bf9",
        storageBucket: "aidmaplebanon-b7bf9.appspot.com",
        messagingSenderId: "1073837686005",
        appId: "1:1073837686005:web:b7ddf450d79b248cb919bc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const notificationSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    var map = L.map('map-container').setView([33.8938, 35.5018], 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    let currentCoords = null;
    let tempMarker = null;
    let currentCategoryFilter = "الكل";

    const centers = {
        "بيروت": [33.89, 35.49], "بعبدا": [33.83, 35.54], "المتن": [33.89, 35.61],
        "عاليه": [33.80, 35.60], "الشوف": [33.69, 35.58], "كسروان": [33.98, 35.61],
        "جبيل": [34.12, 35.65], "طرابلس": [34.44, 35.84], "زغرتا": [34.38, 35.90],
        "عكار": [34.55, 36.07], "زحلة": [33.84, 35.90], "بعلبك": [34.00, 36.20],
        "صيدا": [33.56, 35.37], "صور": [33.27, 35.20], "النبطية": [33.37, 35.48]
    };

    const distSelect = document.getElementById("userDistrict");
    Object.keys(centers).sort().forEach(c => {
        let opt = document.createElement("option");
        opt.value = c; opt.textContent = c;
        distSelect.appendChild(opt);
    });

    distSelect.addEventListener("change", function() {
        if(this.value !== "all") {
            const coords = centers[this.value];
            setTempLocation(coords[0], coords[1], "📍 القضاء: " + this.value);
        }
    });

    function getLocationByGPS() {
        navigator.geolocation.getCurrentPosition(p => {
            setTempLocation(p.coords.latitude, p.coords.longitude, "📍 موقع GPS");
            distSelect.value = "all";
        }, () => alert("يرجى تفعيل الـ GPS"));
    }

    function setTempLocation(lat, lng, msg) {
        if (tempMarker) map.removeLayer(tempMarker);
        currentCoords = [lat, lng];
        tempMarker = L.circle([lat, lng], { color: '#2ecc71', fillColor: '#2ecc71', fillOpacity: 0.8, radius: 400 }).addTo(map).bindPopup(msg).openPopup();
        map.setView([lat, lng], 13);
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        const navId = 'nav-' + (pageId.split('-')[0]);
        if(document.getElementById(navId)) document.getElementById(navId).classList.add('active');
        if(pageId === 'map-page') setTimeout(() => map.invalidateSize(), 200);
    }

    function addRequestToFirebase() {
        const name = document.getElementById('userName').value;
        const phoneRaw = document.getElementById('userPhone').value;
        const type = document.getElementById('userNeedType').value;
        const urgency = document.getElementById('userUrgency').value;
        const text = document.getElementById('userText').value;
        if (!name || !phoneRaw || !currentCoords) return alert("حدد الموقع والبيانات");
        db.collection("requests").add({
            name, phone: String(phoneRaw).trim(), type, urgency, text,
            lat: currentCoords[0], lng: currentCoords[1],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => { alert("تم الإرسال!"); showPage('map-page'); });
    }

    function addDonationToFirebase() {
        const name = document.getElementById('donorName').value;
        const phone = document.getElementById('donorPhone').value;
        const type = document.getElementById('donorType').value;
        const text = document.getElementById('donorOffer').value;
        if (!name || !phone || !text) return alert("تأكد من البيانات");
        db.collection("requests").add({
            name, phone: phone.trim(), type, urgency: "Donation", text,
            lat: 33.8938, lng: 35.5018,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => { alert("شكراً لكم!"); showPage('history-page'); });
    }

    function applyFilter(category) {
        currentCategoryFilter = category;
        document.querySelectorAll('#filter-buttons button').forEach(btn => {
            btn.classList.toggle('active-filter', btn.innerText.includes(category) || (category === 'الكل' && btn.getAttribute('data-ar') === 'الكل'));
        });
        syncData();
    }

    function syncData() {
        let firstLoad = (document.getElementById('history-list').innerText === "جاري تحميل البيانات...");
        db.collection("requests").orderBy("createdAt", "desc").onSnapshot(snap => {
            const histDiv = document.getElementById('history-list');
            const panelDiv = document.getElementById('panel-content');
            
            histDiv.innerHTML = "";
            panelDiv.innerHTML = ""; 

            map.eachLayer(layer => { if(layer instanceof L.Circle && layer !== tempMarker) map.removeLayer(layer); });

            snap.forEach(doc => {
                const d = doc.data();
                const arrivalTime = d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleTimeString('ar-LB') : "الآن";
                
                panelDiv.innerHTML += `
                    <div class="notif-item">
                        <span><strong>${d.name}</strong> عبّأ طلب ${d.type}</span>
                        <small style="color:var(--accent-orange)">${arrivalTime}</small>
                    </div>`;

                if (currentCategoryFilter !== "الكل" && !d.type.includes(currentCategoryFilter)) return;

                const isDonation = d.urgency === "Donation";
                const color = isDonation ? "#2ecc71" : (d.urgency === "Critical" ? "#ff2d75" : "#f39c12");

                L.circle([d.lat, d.lng], { color: color, fillColor: color, fillOpacity: 0.3, weight: 1, radius: 3000 }).addTo(map);

                histDiv.innerHTML += `
                    <div class="history-item ${isDonation ? 'donation' : (d.urgency === 'Critical' ? 'critical' : '')}">
                        <span class="item-header">${d.type} - ${d.name}</span>
                        <span class="item-desc">${d.text}</span>
                        <div class="action-row"><a href="https://wa.me/${d.phone.replace(/\s+/g, '')}" target="_blank" class="whatsapp-btn"><i class="fab fa-whatsapp"></i> ${d.phone}</a></div>
                        <small style="opacity:0.6;"><i class="far fa-clock"></i> ${arrivalTime}</small>
                    </div>`;
            });

            if (!firstLoad && snap.docChanges().some(c => c.type === "added")) {
                const addedDoc = snap.docChanges().find(c => c.type === "added").doc.data();
                if (!isMuted) notificationSound.play().catch(() => {});
                document.getElementById('notif-badge').style.display = 'block';
                const toast = document.getElementById('notif-toast');
                toast.innerHTML = `<i class="fas fa-bell"></i> طلب جديد من ${addedDoc.name}`;
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 4000);
            }
            firstLoad = false;
        });
    }

    window.onload = syncData;
</script>
</body>
</html>
